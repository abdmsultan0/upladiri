
name: Extract ReactSupport ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/reactsupport-import
          unzip -q source-project.zip -d /tmp/reactsupport-import
          cp -a /tmp/reactsupport-import/ReactSupport/. .
          rm source-project.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete ReactSupport project"
          git push
